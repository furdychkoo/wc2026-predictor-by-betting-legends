<style>
  :root{
    --bg-deep:#0A1128;
    --bg-panel:#121B3A;
    --bg-panel-2:#182552;
    --line:#28335E;
    --gold:#FFC845;
    --gold-soft:#7A6324;
    --blue:#2F80FF;
    --text:#F4F6FB;
    --muted:#8793B0;
    --green:#34D399;
    --red:#FF6B6B;
  }
  *{box-sizing:border-box;}
  #app{
    background:radial-gradient(120% 140% at 10% -10%, #16224C 0%, var(--bg-deep) 55%);

  }
  .hero{
    padding:36px 20px 28px;

      var(--bg-panel);

    margin:0;

    background-clip:text;
    color:transparent;
  }
  .hero .sub{
    color:var(--muted);
    font-size:14px;
    margin-top:8px;
    letter-spacing:0.5px;
  }
  .session-box{
    max-width:420px;

    background:var(--bg-panel-2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;

    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .session-name{font-weight:800;font-size:15px;}
  .session-tag{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .code-row{display:flex;gap:8px;}
  .code-row input{
    flex:1;
    background:var(--bg-deep);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    color:var(--text);
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:1px;
  }
  .code-row input:focus{outline:2px solid var(--blue);}
  button{
    cursor:pointer;
    border:none;
    border-radius:8px;
    font-weight:700;
    font-size:13px;
    transition:transform .12s ease, opacity .12s ease;
  }
  button:active{transform:scale(0.97);}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .btn-primary{
    background:linear-gradient(90deg,var(--blue),#5AA0FF);
    color:#fff;
    padding:10px 16px;
  }
  .btn-ghost{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--line);
    padding:8px 12px;
  }
  .err{color:var(--red);font-size:12px;margin-top:8px;}
  .section-title{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--muted);
    margin:36px 20px 14px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .section-title:before, .section-title:after{
    content:"";flex:1;height:1px;background:var(--line);

  .dash-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    max-width:920px;
    margin:0 auto;
    padding:0 20px;
  }
  @media(max-width:760px){.dash-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:480px){.dash-grid{grid-template-columns:1fr;}}
  .card{
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
  }
  .card:hover{border-color:var(--blue);}
  .card.mine{border-color:var(--gold);}
  .card .pname{font-weight:800;font-size:15px;margin-bottom:2px;}
  .card .pstatus{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .ring-wrap{position:absolute;top:12px;right:12px;width:42px;height:42px;}
  .progress-bar-track{

    z-index:50;padding:24px 14px;

    background:var(--bg-deep);

    display:flex;flex-direction:column;

  }
  .overlay-head{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px;border-bottom:1px solid var(--line);
    background:var(--bg-deep);border-radius:18px 18px 0 0;

  .overlay-head h2{font-size:18px;margin:0;}
  .poster{
    background:linear-gradient(165deg,#0d1530,#05070f 70%);

  .poster::-webkit-scrollbar-thumb{background:var(--gold-soft);border-radius:6px;}
  .poster-title{
    text-align:center;font-weight:900;letter-spacing:2px;font-size:clamp(15px,2.6vw,22px);color:var(--gold);
    text-transform:uppercase;margin-bottom:20px;
  }
  .poster-title sup{font-size:.5em;}
  .poster-row{display:flex;align-items:stretch;justify-content:space-between;gap:clamp(1px,0.5vw,10px);}
  .poster-col{display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;height:440px;flex:1;}
  .ppair{display:flex;flex-direction:column;align-items:center;gap:1px;}
  .pflag{line-height:1;display:block;text-align:center;}
  .pflag.r32{font-size:clamp(20px,3.4vw,28px);}
  .pflag.r16{font-size:clamp(26px,4.4vw,36px);}
  .pflag.qf{font-size:clamp(32px,5.5vw,46px);}

  .pflag.champ{font-size:clamp(52px,10vw,76px);margin-top:6px;}
  .pflag-empty{opacity:.2;}

  .pflag.p-dim{opacity:.12;filter:grayscale(.9);}
  .pflag[data-matchid]:hover{transform:scale(1.18);transition:transform .12s ease;}

  .poster-team-label{
    text-align:center;font-size:clamp(12px,2vw,16px);margin-bottom:14px;
    min-height:26px;color:var(--text);display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .poster-team-label.empty{color:var(--muted);font-size:11px;opacity:.5;font-style:italic;}
  .poster-label-close{
    cursor:pointer;color:var(--muted);font-size:13px;padding:2px 6px;
    border-radius:999px;border:1px solid var(--line);margin-left:4px;

  }

  .poster-champ-label{font-size:clamp(9px,1.4vw,13px);font-weight:800;letter-spacing:2px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.3;}
  .poster-champ-name{font-size:clamp(12px,2vw,18px);font-weight:800;color:var(--gold);text-align:center;margin-top:8px;}

  .poster-emblem{display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:28px;}

  }
  .emblem-label{font-size:clamp(9px,1.4vw,12px);font-weight:800;letter-spacing:2px;color:var(--muted);line-height:1.3;text-transform:uppercase;margin-top:4px;}
  .view-toggle{display:flex;gap:6px;margin:0 20px 14px;}

  .view-toggle button.active{background:linear-gradient(90deg,var(--blue),#5AA0FF);color:#fff;border-color:transparent;}
  .overlay-head .deadline-inline{font-size:11px;color:var(--gold);font-weight:700;margin-top:2px;}

    flex:1 1 auto;overflow-y:auto;padding-bottom:20px;
  }

  .trophy-zone{
    text-align:center;padding:22px 20px 6px;

  .trophy-zone.done .trophy{filter:none;opacity:1;text-shadow:0 0 24px rgba(255,200,69,.7);}
  .trophy-zone .champ-name{margin-top:6px;font-weight:900;font-size:18px;letter-spacing:.5px;}
  .trophy-zone .champ-name.empty{color:var(--muted);font-weight:500;font-size:13px;}

  .round{margin:0 20px 18px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg-panel);}
  .round-head{
    padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
    background:var(--bg-panel-2);cursor:pointer;
  }
  .round-head .rname{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:1px;}
  .round-head .rcount{font-size:11px;color:var(--muted);}

  .round-body{padding:10px 12px;}
  .round-body.collapsed{display:none;}
  .round.locked .round-head{opacity:.45;cursor:default;}

  .match{
    display:flex;align-items:stretch;gap:8px;margin:8px 0;
  }
  .team-btn{
    flex:1;display:flex;align-items:center;gap:8px;
    background:var(--bg-deep);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;color:var(--text);
    font-size:13px;text-align:left;font-weight:600;
  }
  .team-btn .flag{font-size:18px;}

  .real-badge{margin-left:auto;font-size:13px;}
  .real-badge.wrong{filter:none;}
  .vs{align-self:center;color:var(--muted);font-size:11px;font-weight:700;padding:0 2px;}

  .readonly-note{
    margin:0 20px 14px;font-size:12px;color:var(--muted);
    background:var(--bg-panel-2);border:1px solid var(--line);
    border-radius:10px;padding:10px 14px;
  }
  .tabs{
    display:flex;gap:6px;justify-content:center;flex-wrap:wrap;
    margin:22px auto 0;max-width:560px;padding:0 20px;
  }
  .tab-btn{
    background:var(--bg-panel-2);border:1px solid var(--line);color:var(--muted);
    padding:9px 16px;border-radius:999px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;
  }
  .tab-btn.active{background:linear-gradient(90deg,var(--blue),#5AA0FF);color:#fff;border-color:transparent;}

  .compare-wrap{max-width:760px;margin:0 auto;padding:0 20px;}
  .compare-pickers{display:flex;gap:10px;margin-bottom:18px;}
  .compare-pickers select{
    flex:1;background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:10px;font-size:13px;
  }
  .cmp-round{margin-bottom:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .cmp-round-head{background:var(--bg-panel-2);padding:10px 14px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:800;}
  .cmp-pair{
    padding:8px 14px 0;font-size:11px;color:var(--muted);font-weight:700;
    text-transform:uppercase;letter-spacing:.3px;border-top:1px solid var(--line);
  }
  .cmp-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 14px 8px;}
  .cmp-cell{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--bg-panel);border-left:5px solid transparent;}
  .cmp-cell.match{border-left:5px solid var(--green);}
  .cmp-cell.empty{color:var(--muted);font-style:italic;}
  .cmp-correct-badge{
    display:inline-flex;align-items:center;gap:3px;margin-left:8px;
    background:rgba(52,211,153,0.2);color:var(--green);
    font-size:10px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;
    padding:2px 8px;border-radius:999px;vertical-align:middle;
  }

  .lb-table{max-width:640px;margin:0 auto;padding:0 20px;}
  .lb-row{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--bg-panel-2);border:1px solid var(--line);border-radius:12px;
    padding:12px 16px;margin-bottom:8px;transition:border-color .15s ease;
  }
  .lb-row:hover{border-color:var(--blue);}
  .lb-row.lb-mine{border-color:var(--gold);}
  .lb-row .lb-rank{font-weight:900;font-size:18px;width:32px;text-align:center;}
  .lb-row .lb-name{flex:1;font-weight:700;font-size:14px;padding:0 10px;}
  .lb-row .lb-score{font-weight:900;font-size:16px;color:var(--blue);}
  .lb-empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 20px;}

  /* ---------- BL таблиця ---------- */
  .bl-tab{max-width:900px;margin:0 auto;padding:0 20px;}
  .bl-controls{display:flex;gap:8px;justify-content:center;margin-bottom:14px;}
  .bl-sort-btn{
    background:var(--bg-panel-2);border:1px solid var(--line);color:var(--muted);
    padding:8px 14px;border-radius:999px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;
  }
  .bl-sort-btn.active{background:linear-gradient(90deg,var(--blue),#5AA0FF);color:#fff;border-color:transparent;}
  .bl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;-webkit-overflow-scrolling:touch;}
  table.bl-table{border-collapse:collapse;width:100%;min-width:680px;font-size:13px;}
  table.bl-table thead th{
    background:var(--bg-panel-2);color:var(--muted);font-size:11px;text-transform:uppercase;
    letter-spacing:.4px;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center;
  }
  table.bl-table thead th:first-child{text-align:left;padding-left:14px;}
  table.bl-table td{padding:8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;}
  table.bl-table tr:last-child td{border-bottom:none;}
  .bl-name-cell{display:flex;align-items:center;gap:6px;text-align:left!important;padding-left:14px!important;font-weight:700;}
  .bl-move{display:flex;flex-direction:column;gap:1px;}
  .bl-move-btn{
    background:var(--bg-panel);border:1px solid var(--line);color:var(--muted);
    font-size:9px;line-height:1;padding:2px 4px;border-radius:4px;
  }
  .bl-move-btn:disabled{opacity:.25;}
  .bl-cell{
    background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:6px 10px;font-weight:800;font-size:13px;min-width:50px;
  }
  .bl-cell:hover{border-color:var(--blue);}
  .bl-cell-sub{color:var(--muted);font-weight:500;font-size:11px;}
  .bl-cell-bonus{color:var(--gold);}
  .bl-cell-static{font-weight:800;color:var(--text);}
  .bl-bracket-input{
    width:52px;background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:6px 4px;font-weight:800;font-size:13px;text-align:center;
  }
  .bl-bracket-input:focus{outline:2px solid var(--blue);}
  .bl-total-cell{font-weight:900;font-size:15px;color:var(--gold);}
  .bl-panel{
    margin-top:14px;background:var(--bg-panel-2);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;
  }
  .bl-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:14px;}
  .bl-panel-close{
    background:var(--bg-panel);border:1px solid var(--line);color:var(--muted);
    border-radius:8px;padding:4px 10px;font-size:12px;
  }
  .bl-panel-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--muted);margin-bottom:12px;align-items:center;}
  .legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bg-panel);margin-right:4px;vertical-align:middle;}
  .legend-dot.bonus-win{border:2px solid var(--gold);}
  .legend-dot.bonus-lose{border:2px solid var(--orange);}
  .bl-track{margin-bottom:14px;}
  .bl-track:last-child{margin-bottom:0;}
  .bl-track-label{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:8px;}
  .bl-dots{display:flex;flex-wrap:wrap;gap:6px;}
  .bl-dot{
    width:16px;height:16px;border-radius:50%;background:var(--bg-panel);
    border:1px solid var(--line);display:inline-block;box-sizing:border-box;
  }
  .bl-dot.filled{background:var(--green);border-color:var(--green);}
  .bl-dot.editable{cursor:pointer;}

  function savePicks(code, data){
    // debounce: collapse rapid successive clicks into one write
    savePending[code] = data;
    if (saveTimers[code]) clearTimeout(saveTimers[code]);
    saveTimers[code] = setTimeout(function(){
      flushSave(code);
    }, 400);
  }

  async function flushSave(code, attempt){
    attempt = attempt || 0;
    if (saveBusy[code]){
      // a write is already in flight; try again shortly once it's done
      setTimeout(function(){ flushSave(code, attempt); }, 300);
      return;
    }
    var data = savePending[code];
    if (!data) return;
    saveBusy[code] = true;
    var payload = JSON.stringify(data);
    try{
      await db.ref('picks/' + code).set(payload);
      delete savePending[code];
    }catch(e){
      if (attempt < 4){
        var delay = 1200 * Math.pow(2, attempt); // backoff: 1.2s, 2.4s, 4.8s, 9.6s
        setTimeout(function(){ flushSave(code, attempt+1); }, delay);
      }
      // silent — transient storage errors are expected under load
    } finally {
      saveBusy[code] = false;
    }
  }

    for (var i=0; i<prevRound.length; i+=2){
      var id = roundKey+"-"+((i/2)+1);

    var idx = order.indexOf(rk);
    for (var i=idx; i<order.length; i++){
      path[order[i]+"-"+num] = true;
      num = Math.ceil(num/2);
    }
    return path;
  }

  var GROUP_MATCH_COUNT = 72;
  var GROUP_LETTERS = ["A","B","C","D","E","F","G","H","I","J","K","L"];
  var BL_BASE = {group:1, playoff:2, advance:1, bracket:1};
  var BL_STREAK_WIN = 3;
  var BL_STREAK_LOSE = 5;

  function buildGroupMatchList(){
    var list = [];
    for (var g=0; g<GROUP_LETTERS.length; g++){
      for (var m=1; m<=6; m++){
        list.push({id:"grp-"+GROUP_LETTERS[g]+"-"+m, label:"Група "+GROUP_LETTERS[g]+" · матч "+m});

  function defaultBLPerson(){
    return {
      group: new Array(GROUP_MATCH_COUNT).fill(false),

      bracket: 0
    };
  }
  function defaultBLTable(){
    var data = {};
    Object.keys(PARTICIPANTS).forEach(function(code){ data[code] = defaultBLPerson(); });
    return {data:data, order: Object.keys(PARTICIPANTS).slice(), sortMode:'manual'};

  async function loadBLTable(){
    try{
      var snapBL = await db.ref('bl_table').get();
      var base = defaultBLTable();
      if (snapBL.exists()){
        var parsed = JSON.parse(snapBL.val());
        Object.keys(base.data).forEach(function(code){
          var p = parsed.data && parsed.data[code];
          if (p){
            base.data[code] = {
              group: (Array.isArray(p.group) && p.group.length===GROUP_MATCH_COUNT) ? p.group : base.data[code].group,
              playoff: (Array.isArray(p.playoff) && p.playoff.length===TOTAL_MATCHES) ? p.playoff : base.data[code].playoff,
              advance: (Array.isArray(p.advance) && p.advance.length===TOTAL_MATCHES) ? p.advance : base.data[code].advance,
              bracket: typeof p.bracket === 'number' ? p.bracket : 0
            };
          }
        });
        if (Array.isArray(parsed.order)){
          base.order = parsed.order.filter(function(c){ return !!PARTICIPANTS[c]; });
          Object.keys(PARTICIPANTS).forEach(function(c){ if (base.order.indexOf(c)===-1) base.order.push(c); });
        }
        base.sortMode = parsed.sortMode === 'sum' ? 'sum' : 'manual';
      }
      state.blTable = base;
    }catch(e){
      state.blTable = defaultBLTable();
    }
  }

  // Обчислює бонуси одного треку
  function computeTrackBonus(arr, baseValue){
    var hitStreak = 0, missStreak = 0, total = 0;
    var marks = new Array(arr.length).fill(null);
    for (var i=0; i<arr.length; i++){
      if (arr[i]){
        var loseFire = missStreak >= BL_STREAK_LOSE;
        hitStreak++;
        var winFire = (hitStreak % BL_STREAK_WIN === 0);
        if (loseFire){ marks[i] = 'lose'; total += baseValue; }
        else if (winFire){ marks[i] = 'win'; total += baseValue; }
        missStreak = 0;
      } else {
        missStreak++;
        hitStreak = 0;
      }
    }
    return {total:total, marks:marks};
  }

  function blScoreCounts(code){
    var p = state.blTable.data[code];
    var groupCount = p.group.filter(Boolean).length;
    var playoffCount = p.playoff.filter(Boolean).length;
    var advanceCount = p.advance.filter(Boolean).length;
    var bracket = p.bracket || 0;
    var advBonus = computeTrackBonus(p.advance, BL_BASE.advance);
    var playBonus = computeTrackBonus(p.playoff, BL_BASE.playoff);
    var bonusTotal = advBonus.total + playBonus.total;
    var total = playoffCount*BL_BASE.playoff + advanceCount*BL_BASE.advance + bracket*BL_BASE.bracket + bonusTotal;
    return {
      groupCount:groupCount, playoffCount:playoffCount, advanceCount:advanceCount,
      bracket:bracket, bonusTotal:bonusTotal, total:total, advBonus:advBonus, playBonus:playBonus
    };
  }

  function formatDeadlineExact(){
    var d = new Date(DEADLINE_TS);
    var months = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
    var hh = String(d.getHours()).padStart(2,'0');
    var mm = String(d.getMinutes()).padStart(2,'0');
    return d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear()+', '+hh+':'+mm;
  }

  function publicWinners(code){
    if (code === REAL_CODE) return (state.allPicks[REAL_CODE]||{}).winners || {};
    var d = state.allPicks[code] || {};
    return d.submittedWinners || {};
  }

  function deadlineLabel(compact){
    var diff = DEADLINE_TS - Date.now();
    if (diff <= 0) return "Прийом прогнозів закрито";
    var days = Math.floor(diff / 86400000);
    var hours = Math.floor((diff % 86400000) / 3600000);
    var mins = Math.floor((diff % 3600000) / 60000);
    var secs = Math.floor((diff % 60000) / 1000);
    var pre = compact ? "" : "До дедлайну: ";
    if (days > 0) return pre+days+" дн "+hours+" год";
    if (hours > 0) return pre+hours+" год "+mins+" хв";
    return pre+mins+" хв "+secs+" с";
  }

  function pickWinner(code, matchId, team){
    var data = state.allPicks[code] || {winners:{}, submittedWinners:null, submittedAt:null};
    if (code !== REAL_CODE && isPastDeadline()) return; // hard lock after deadline
    var winners = Object.assign({}, data.winners);
    if (winners[matchId] === team){
      delete winners[matchId];
    } else {
      winners[matchId] = team;
    }
    // cascade clear: any match in later rounds whose id depends on this one gets reset if its current value no longer matches
    var order = ["r32","r16","qf","sf","final"];
    var roundOf = matchId.split("-")[0];
    var startIdx = order.indexOf(roundOf) + 1;
    for (var i = startIdx; i < order.length; i++){
      var rk = order[i];
      var fresh = getRound(rk, winners);
      fresh.forEach(function(m){
        if (winners[m.id] && winners[m.id] !== m.teamA && winners[m.id] !== m.teamB){
          delete winners[m.id];
        }
      });
    }
    var newData = {winners: winners, updatedAt: Date.now(), submittedWinners: data.submittedWinners||null, submittedAt: data.submittedAt||null};
    state.allPicks[code] = newData;
    render();
    savePicks(code, newData);
  }

  function submitBracket(code){
    if (isPastDeadline()) return;
    var data = state.allPicks[code] || {winners:{}};
    var newData = {winners: data.winners, updatedAt: Date.now(), submittedWinners: Object.assign({}, data.winners), submittedAt: Date.now()};
    state.allPicks[code] = newData;
    state.confirmSubmit = false;
    state.bracketEditMode[code] = false; // back to read-only published view
    render();
    savePicks(code, newData);
  }

  function exportBackup(){

      backup.data[code] = state.allPicks[code] || {winners:{}, submittedWinners:null, submittedAt:null};
    });
    var blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'wc2026-backup-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.json';
    document.body.appendChild(a);

  }

  function importBackupFile(file){
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var parsed = JSON.parse(e.target.result);
        var data = parsed.data || parsed; // tolerate raw dumps too
        var codes = Object.keys(PARTICIPANTS).concat([REAL_CODE]);
        codes.forEach(function(code){
          if (data[code]){
            state.allPicks[code] = data[code];
            savePicks(code, data[code]);
          }
        });
        state.importMsg = '✅ Дані відновлено з бекапу.';
        render();
      }catch(err){
        state.importMsg = '❌ Не вдалося прочитати файл бекапу.';
        render();
      }
    };
    reader.readAsText(file);
  }

  function computeScore(code){
    var real = (state.allPicks[REAL_CODE]||{}).winners || {};
    var mine = publicWinners(code);
    var total = 0;
    Object.keys(mine).forEach(function(matchId){
      if (real[matchId] && real[matchId] === mine[matchId]) total++;
    });
    return total;
  }

  function computeRoundScore(code, roundKey){
    var real = (state.allPicks[REAL_CODE]||{}).winners || {};
    var mine = publicWinners(code);
    var matches = getRound(roundKey, real);
    var score = 0;
    matches.forEach(function(m){ if(m.winner && mine[m.id] === m.winner) score++; });
    return score;
  }

  function compareTabHTML(){
    var codes = Object.keys(PARTICIPANTS).concat([REAL_CODE]);

    if (!state.compareA) state.compareA = codes[0];
    if (!state.compareB) state.compareB = codes[1] || codes[0];
    var options = function(selected){
      return codes.map(function(c){

      }).join('');
    };
    var winnersA = publicWinners(state.compareA);
    var winnersB = publicWinners(state.compareB);
    var realWinners = (state.allPicks[REAL_CODE]||{}).winners || {};

    var roundsHTML = ROUND_DEFS.map(function(rd){
      var matchesA = getRound(rd.key, winnersA);
      var matchesB = getRound(rd.key, winnersB);
      var matchesReal = getRound(rd.key, realWinners);
      var rows = matchesA.map(function(mA, idx){
        var mB = matchesB[idx];
        var mR = matchesReal[idx];
        var pickA = mA.winner;
        var pickB = mB.winner;
        var same = pickA && pickB && pickA === pickB;
        var pairSrc = (mR.teamA && mR.teamB) ? mR : ((mA.teamA && mA.teamB) ? mA : ((mB.teamA && mB.teamB) ? mB : null));
        var pairLabel = pairSrc ? (pairSrc.teamA+' — '+pairSrc.teamB) : 'Пара ще не визначена';
        var realW = mR.winner || null;
        var checkA = (pickA && realW && pickA === realW) ? ' <span class="cmp-correct-badge">✅ вгадано</span>' : '';
        var checkB = (pickB && realW && pickB === realW) ? ' <span class="cmp-correct-badge">✅ вгадано</span>' : '';

        var cellB = pickB ? '<span class="flag">'+(FLAGS[pickB]||'')+'</span> '+pickB+checkB : '<span class="empty">— не обрано —</span>';

  function leaderboardTabHTML(){
    var real = (state.allPicks[REAL_CODE]||{}).winners || {};
    var realFilled = countFilled(real);
    var codes = Object.keys(PARTICIPANTS);
    var rows = codes.map(function(code){
      return {code:code, name:PARTICIPANTS[code], score: computeScore(code)};
    }).sort(function(a,b){ return b.score - a.score; });

    if (realFilled === 0){
      return '<div class="lb-table"><div class="lb-empty">Офіційні результати ще не внесені — рейтинг з\'явиться, коли турнір почнеться.</div></div>';
    }

    var maxScore = Math.max.apply(null, rows.map(function(r){ return r.score; })) || 1;
    var medals = ["🥇","🥈","🥉"];

    // Classic table
    var tableHTML = rows.map(function(r, i){
      var mine = state.session && state.session.code === r.code;
      return '<div class="lb-row'+(mine?' lb-mine':'')+'" data-open="'+r.code+'" style="cursor:pointer;">'
        +'<span class="lb-rank">'+(medals[i]||('#'+(i+1)))+'</span>'
        +'<span class="lb-name">'+r.name+'</span>'
        +'<span class="lb-score">'+r.score+' / '+TOTAL_MATCHES+'</span>'
        +'</div>';
    }).join('');

    // SVG bar chart
    var W = 560, H = 200, PAD_L = 28, PAD_B = 44, PAD_T = 20, PAD_R = 16;
    var chartW = W - PAD_L - PAD_R;
    var chartH = H - PAD_T - PAD_B;
    var barW = Math.floor(chartW / rows.length * 0.55);
    var gap = Math.floor(chartW / rows.length);
    var yMax = Math.max(maxScore, 4);

    var bars = rows.map(function(r, i){
      var x = PAD_L + i * gap + (gap - barW) / 2;
      var bh = Math.round((r.score / yMax) * chartH);
      var y = PAD_T + chartH - bh;
      var mine = state.session && state.session.code === r.code;
      var color = mine ? '#FFC845' : 'url(#barGrad)';
      var firstName = r.name.split(' ')[0];
      return '<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+bh+'" rx="4" fill="'+color+'" opacity="0.9"/>'
        +'<text x="'+(x+barW/2)+'" y="'+(y-5)+'" text-anchor="middle" font-size="11" fill="#F4F6FB" font-weight="700">'+r.score+'</text>'
        +'<text x="'+(x+barW/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="#8793B0">'+firstName+'</text>';
    }).join('');

    // Y axis lines
    var yLines = [0, Math.round(yMax/2), yMax].map(function(v){
      var y = PAD_T + chartH - Math.round((v/yMax)*chartH);
      return '<line x1="'+PAD_L+'" y1="'+y+'" x2="'+(W-PAD_R)+'" y2="'+y+'" stroke="#28335E" stroke-width="1"/>'
        +'<text x="'+(PAD_L-4)+'" y="'+(y+4)+'" text-anchor="end" font-size="9" fill="#8793B0">'+v+'</text>';
    }).join('');

    var svgChart = '<div style="overflow-x:auto;margin:0 auto 8px;max-width:640px;padding:0 20px;">'
      +'<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" style="width:100%;max-width:'+W+'px;display:block;margin:0 auto;">'
      +'<defs><linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2F80FF"/><stop offset="100%" stop-color="#34D399"/></linearGradient></defs>'
      + yLines + bars
      +'</svg></div>';

    return '<div class="lb-table">'+tableHTML+'</div>'
      +'<div class="section-title">Вгадані матчі</div>'
      + svgChart;
  }

      + (state.openOverlayCode ? overlayHTML(state.openOverlayCode) : '');

    // bind events
    var enterBtn = document.getElementById('enterBtn');
    if (enterBtn) enterBtn.onclick = handleEnter;

    if (codeInput) codeInput.onkeydown = function(e){ if (e.key==='Enter') handleEnter(); };

    document.querySelectorAll('[data-open]').forEach(function(el){
      el.onclick = function(){
        var code = el.getAttribute('data-open');
        state.openOverlayCode = code;
        state.expandedRound = {r32:true, r16:true, qf:true, sf:true, final:true};
        var d = state.allPicks[code] || {};
        var hasPublished = code !== REAL_CODE && !!d.submittedWinners;
        state.bracketEditMode[code] = !hasPublished;
        state.confirmSubmit = false;
        render();
      };
    });
    var closeBtn = document.getElementById('closeOverlay');
    if (closeBtn) closeBtn.onclick = function(){ state.openOverlayCode = null; render(); };
    var overlay = document.getElementById('overlay');
    if (overlay) overlay.addEventListener('click', function(e){ if (e.target.id === 'overlay'){ state.openOverlayCode=null; render(); } });
    var overlayBody = document.getElementById('overlayBody');
    if (overlayBody){
      overlayBody.scrollTop = savedScroll;
      if (state.scrollToRound){
        var targetEl = overlayBody.querySelector('[data-round="'+state.scrollToRound+'"]');
        if (targetEl){
          requestAnimationFrame(function(){
            targetEl.scrollIntoView({behavior:'smooth', block:'nearest'});
          });
        }
        state.scrollToRound = null;
      }
    }

    document.querySelectorAll('[data-toggle]').forEach(function(el){
      el.onclick = function(){
        var k = el.getAttribute('data-toggle');
        state.expandedRound[k] = !state.expandedRound[k];
        state.scrollToRound = k;
        render();
      };
    });

    document.querySelectorAll('.team-btn[data-match]').forEach(function(el){
      el.onclick = function(){
        var matchId = el.getAttribute('data-match');
        var team = el.getAttribute('data-team');
        pickWinner(state.openOverlayCode, matchId, team);
      };
    });

    document.querySelectorAll('[data-tab]').forEach(function(el){
      el.onclick = function(){
        state.activeTab = el.getAttribute('data-tab');
        render();
      };
    });
    var cmpA = document.getElementById('cmpA');
    if (cmpA) cmpA.onchange = function(){ state.compareA = cmpA.value; render(); };
    var cmpB = document.getElementById('cmpB');
    if (cmpB) cmpB.onchange = function(){ state.compareB = cmpB.value; render(); };

    var openSubmitBtn = document.getElementById('openSubmitBtn');
    if (openSubmitBtn) openSubmitBtn.onclick = function(){ state.confirmSubmit = true; render(); };
    var cancelSubmitBtn = document.getElementById('cancelSubmitBtn');
    if (cancelSubmitBtn) cancelSubmitBtn.onclick = function(){ state.confirmSubmit = false; render(); };
    var confirmSubmitBtn = document.getElementById('confirmSubmitBtn');
    if (confirmSubmitBtn) confirmSubmitBtn.onclick = function(){ submitBracket(state.openOverlayCode); };
    var enterEditBtn = document.getElementById('enterEditBtn');
    if (enterEditBtn) enterEditBtn.onclick = function(){ state.bracketEditMode[state.openOverlayCode] = true; render(); };
    var cancelEditBtn = document.getElementById('cancelEditBtn');
    if (cancelEditBtn) cancelEditBtn.onclick = function(){ cancelEditing(state.openOverlayCode); };
    var openResetBtn = document.getElementById('openResetBtn');
    if (openResetBtn) openResetBtn.onclick = function(){ state.confirmReset = true; render(); };
    var cancelResetBtn = document.getElementById('cancelResetBtn');
    if (cancelResetBtn) cancelResetBtn.onclick = function(){ state.confirmReset = false; render(); };
    var confirmResetBtn = document.getElementById('confirmResetBtn');
    if (confirmResetBtn) confirmResetBtn.onclick = function(){ resetAllPredictions(); };
    var syncAPIBtn = document.getElementById('syncAPIBtn');
    if (syncAPIBtn) syncAPIBtn.onclick = syncFromAPI;
    var saveDeadlineBtn = document.getElementById('saveDeadlineBtn');
    if (saveDeadlineBtn) saveDeadlineBtn.onclick = function(){
      var input = document.getElementById('deadlineInput');
      if (!input || !input.value) return;
      var ts = new Date(input.value).getTime();
      if (!isNaN(ts)) saveCustomDeadline(ts);
    };
    var exportBackupBtn = document.getElementById('exportBackupBtn');
    if (exportBackupBtn) exportBackupBtn.onclick = exportBackup;
    var importBackupInput = document.getElementById('importBackupInput');
    if (importBackupInput) importBackupInput.onchange = function(e){
      if (e.target.files && e.target.files[0]) importBackupFile(e.target.files[0]);
    };
    var adminPeekBtn = document.getElementById('adminPeekBtn');
    if (adminPeekBtn) adminPeekBtn.onclick = function(){
      var c = state.openOverlayCode;
      state.adminPeekDraft[c] = !state.adminPeekDraft[c];
      render();
    };

    // view toggle (Список / Сітка) inside overlay
    document.querySelectorAll('[data-view]').forEach(function(btn){
      btn.onclick = function(e){
        e.stopPropagation();
        if (!state.openOverlayCode) return;
        state.posterView[state.openOverlayCode] = (btn.getAttribute('data-view') === 'poster');
        state.highlightTeam = null;
        render();
      };
    });


    // ---------- BL таблиця events ----------
    if (state.activeTab === 'bl' && state.blTable){
      document.querySelectorAll('[data-bl-cell]').forEach(function(el){
        el.onclick = function(){
          var parts = el.getAttribute('data-bl-cell').split('|');
          var code = parts[0], col = parts[1];
          if (state.blExpanded && state.blExpanded.code===code && state.blExpanded.col===col){
            state.blExpanded = null;
          } else {
            state.blExpanded = {code:code, col:col};
          }
          render();
        };
      });
      document.querySelectorAll('[data-bl-dot]').forEach(function(el){
        el.onclick = function(){
          if (!(state.session && state.session.isAdmin)) return;
          var parts = el.getAttribute('data-bl-dot').split('|');
          var code = parts[0], col = parts[1], idx = parseInt(parts[2],10);
          var person = state.blTable.data[code];
          if (!person || !person[col]) return;
          person[col][idx] = !person[col][idx];
          saveBLTable();
          render();
        };
      });
      document.querySelectorAll('[data-bl-bracket]').forEach(function(el){
        el.onchange = function(){
          var code = el.getAttribute('data-bl-bracket');
          var v = parseInt(el.value, 10);
          if (isNaN(v) || v < 0) v = 0;
          state.blTable.data[code].bracket = v;
          saveBLTable();
          render();
        };
      });
      var blSortSum = document.getElementById('blSortSum');
      if (blSortSum) blSortSum.onclick = function(){ state.blTable.sortMode = 'sum'; saveBLTable(); render(); };
      var blSortManual = document.getElementById('blSortManual');
      if (blSortManual) blSortManual.onclick = function(){ state.blTable.sortMode = 'manual'; saveBLTable(); render(); };
      document.querySelectorAll('[data-bl-move]').forEach(function(el){
        el.onclick = function(){
          var parts = el.getAttribute('data-bl-move').split('|');
          var code = parts[0], dir = parts[1];
          var order = state.blTable.order;
          var idx = order.indexOf(code);
          var swapWith = dir === 'up' ? idx - 1 : idx + 1;
          if (swapWith < 0 || swapWith >= order.length) return;
          var tmp = order[idx]; order[idx] = order[swapWith]; order[swapWith] = tmp;
          saveBLTable();
          render();
        };
      });
      var blClosePanel = document.getElementById('blClosePanel');
      if (blClosePanel) blClosePanel.onclick = function(){ state.blExpanded = null; render(); };
    }

    var carouselWrap = document.getElementById('carouselWrap');
    if (carouselWrap){
      var carCodes = [REAL_CODE].concat(Object.keys(PARTICIPANTS));
      var n = carCodes.length;
      document.getElementById('carPrev') && (document.getElementById('carPrev').onclick = function(){ state.carouselIndex = (state.carouselIndex - 1 + n) % n; render(); });
      document.getElementById('carNext') && (document.getElementById('carNext').onclick = function(){ state.carouselIndex = (state.carouselIndex + 1) % n; render(); });
      document.querySelectorAll('[data-dot]').forEach(function(el){
        el.onclick = function(){ state.carouselIndex = parseInt(el.getAttribute('data-dot'),10); render(); };
      });
      var tx = null;
      carouselWrap.addEventListener('touchstart',function(e){ tx = e.touches[0].clientX; },{passive:true});
      carouselWrap.addEventListener('touchend',function(e){
        if(tx===null) return;
        var dx = e.changedTouches[0].clientX - tx; tx = null;
        if(Math.abs(dx)>50){ state.carouselIndex=(state.carouselIndex+(dx<0?1:-1)+n)%n; render(); }
      });
    }
  }

  function handleEnter(){
    var input = document.getElementById('codeInput');
    var val = (input.value || '').trim().toUpperCase();
    if (val === ADMIN_CODE){
      state.session = {code:val, name:'Адміністратор', isAdmin:true};
      state.err = "";
    } else if (PARTICIPANTS[val]){
      state.session = {code:val, name:PARTICIPANTS[val], isAdmin:false};
      state.err = "";
    } else {
      state.err = "Невірний код доступу. Перевірте та спробуйте ще раз.";
    }
    render();
  }

  // ---------- init ----------
  loadAll().then(function(data){
    state.allPicks = data;
    state.loading = false;
    return loadCustomDeadline();
  }).then(function(){
    return loadBLTable();
  }).then(function(){
    render();
    setInterval(tickTimers, 1000);
    setInterval(syncFromAPI, 10 * 60 * 1000);

    // single persistent click handler for poster flag interaction
    document.addEventListener('click', function(e){
      var tag = e.target.tagName;
      if (tag === 'INPUT' || tag === 'BUTTON' || tag === 'SELECT' || tag === 'LABEL' || tag === 'TEXTAREA') return;
      var flag = e.target.closest ? e.target.closest('[data-matchid]') : null;
      if (flag){
        var team = flag.getAttribute('data-team');
        if (team){
          state.highlightTeam = (state.highlightTeam === team) ? null : team;
          render(); return;
        }
      }
      var clear = e.target.closest ? e.target.closest('[data-clearhighlight]') : null;
      if (clear){ state.highlightTeam = null; render(); }
    });
  });
})();
</script>
